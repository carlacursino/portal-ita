services:
  pgcomp:
    container_name: pgcomp
    build:
      context: .
      dockerfile: Dockerfile.portal
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
        - PORT=${PORT:-3000}
        - ECOSYSTEM=${ECOSYSTEM:-portal}
    image: pgcomp:latest
    expose:
      - "${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    networks:
      - netlab01
    volumes:
      - $PWD/config:/pgcomp/site01/config
      - pgcompdata:/app/assets/static/core/uploads

volumes:
  pgcompdata:
    name: pgcompdata
    external: true

networks:
  netlab01:
    external: true
