services:
  pgcomp:
    container_name: pgcomp
    build:
      context: .
      dockerfile: Dockerfile.pgcomp
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    expose:
      - "3004"
    networks:
      - netlab01
    volumes:
      - $PWD/config:/pgcomp/site01/config
      - pgcompdata:/app/assets/static/core/uploads

volumes:
  pgcompdata:
    name: pgcompdata
    external: true

networks:
  netlab01:
    external: true
