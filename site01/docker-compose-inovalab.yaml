services:
  inovalab:
    container_name: inovalab
    build:
      context: .
      dockerfile: Dockerfile.portal
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
        - PORT=${PORT:-3000}
        - ECOSYSTEM=${ECOSYSTEM:-portal}
    image: inovalab:latest
    expose:
      - "${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    networks:
      - netlab01
    volumes:
      - $PWD/config:/inovalab/site01/config
      - inovalabdata:/app/assets/static/core/uploads

volumes:
  inovalabdata:
    name: inovalabdata
    external: true

networks:
  netlab01:
    external: true
