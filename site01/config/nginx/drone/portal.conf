server {
        listen 80;
        listen [::]:80;
        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;
        server_name node.exampledomain.com www.node.exampledomain.com;
        location / {
                proxy_pass http://drone:3003;
        }
        location ~ /.well-known/acme-challenge {
                allow all;
                root /var/www/html;
        }
}
