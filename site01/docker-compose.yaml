services:

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - PORT=${PORT:-3000}
      - ECOSYSTEM=${ECOSYSTEM:-portal}
    volumes:
      - $PWD/config/nginx/${ECOSYSTEM:-portal}:/etc/nginx/templates
    command: /bin/bash -c "envsubst < /etc/nginx/templates/portal.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    
  mongodb:
    container_name: mongodb
    image: mongo:4.4.14-focal
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db:rw
      - $PWD/config/mongodb/${ECOSYSTEM:-portal}/config/custom.conf:/etc/mongo/custom.conf:ro
      - $PWD/config/mongodb/${ECOSYSTEM:-portal}/config/.mdbpass:/etc/mongo/.mdbpass:ro
      - $PWD/config/mongodb/${ECOSYSTEM:-portal}/init:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${SVC_PWD}
    command: --config /etc/mongo/custom.conf

  # admin:
  #   container_name: admin
  #   image: mongo-express
  #   restart: unless-stopped
  #   ports:
  #     - ':8081'
  #   environment:
  #     ME_CONFIG_MONGODB_SERVER: mongodb
  #     ME_CONFIG_MONGODB_ENABLE_ADMIN: true
  #     ME_CONFIG_MONGODB_AUTH_USERNAME: root
  #     ME_CONFIG_MONGODB_AUTH_PASSWORD: ${SVC_PWD}

  app:
    container_name: ${ECOSYSTEM:-app}
    build:
      context: .
      dockerfile: Dockerfile.portal
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
        - PORT=${PORT:-3000}
        - ECOSYSTEM=${ECOSYSTEM:-portal}
    image: ${ECOSYSTEM:-portal}:latest
    expose:
      - "${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    volumes:
      - $PWD/custom/${ECOSYSTEM:-portal}.js:/app/config/custom/${ECOSYSTEM:-portal}.js
      - portaldata:/app/assets/static/core/uploads

volumes:
  mongodata:
    name: ${ECOSYSTEM:-portal}dbdata
    external: true
  portaldata:
    name: ${ECOSYSTEM:-portal}data
    external: true
